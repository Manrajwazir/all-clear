# Security CI — Blocks PRs with vulnerable dependencies or leaked secrets
# Phase 2, Step 2.8
#
# Runs three checks on every PR:
#   1. npm audit    — catches known CVEs in dashboard dependencies
#   2. pip-audit    — catches known CVEs in detection dependencies
#   3. gitleaks     — scans full git history for leaked secrets/keys
#
# Zero critical/high findings policy: if any check fails, the PR cannot merge.

name: Security Audit

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

  # THE TRIGGER THAT WAS MISSING, added 2026-09-21.
  #
  # On 2026-09-17 two CRITICAL advisories were found by hand, days after they
  # were published. This workflow already existed and already ran `npm audit
  # --audit-level=high`, so the check was not missing -- only the occasion to
  # run it was. It fires on push and pull request, the last push was 2026-09-15,
  # and the advisories landed after it. Nobody pushed, so nobody was told.
  #
  # That is the whole lesson of the incident in one line: **dependency security
  # is the one category that decays while you are not touching the code.**
  # Every other check in this repo answers "did this change break something".
  # This one has to answer "did the world change under something that still
  # works", and that question has no commit attached to it.
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily, ~07:00 Edmonton. Before the workday.

  workflow_dispatch: # so it can be run by hand after an advisory lands

jobs:
  npm-audit:
    name: npm audit (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      # npm ci, NOT npm install. ci installs exactly the lockfile; install may
      # resolve differently, and a CI run that does not match anyone machine is
      # worse than no CI run, because it is believed.
      - run: npm ci
      # Fails on high and critical; moderate and low pass. A deliberate policy,
      # not laziness: a gate that fires on everything trains people to ignore
      # it, and alert fatigue is the same failure as a silent check wearing
      # different clothes.
      - run: npm audit --audit-level=high

  pip-audit:
    name: pip-audit (detection)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip install -e .
      - run: pip-audit --strict --desc

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THE LOAD-BEARING LINE. Fetches the ENTIRE history rather than the
          # tip. A secret committed and later deleted is still in history: the
          # commit object holds it forever, and removing the file changes
          # nothing. Scanning only the diff would find nothing and say so
          # confidently.
          #
          # This is the check that let a claim that detection/.env was in git
          # history be disproved rather than argued about.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
